[package]
name = "forest-chat"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["src-tauri"]
resolver = "3"

[profile.dev]
debug = 0

[dependencies]
actix-files = "0.6"
actix-multipart = "0.7"
actix-web = "4"
actix-ws = "0.3"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
bytestring = "1"
env_logger = "0.11.11"
futures-util = "0.3"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
turso = "0.7.2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

