[package]
name = "forest-chat"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["src-tauri"]
resolver = "3"

[profile.dev]
debug = 0

[dependencies]
actix-web = "4"
actix-ws = "0.3"
bytestring = "1"
env_logger = "0.11.11"
futures-util = "0.3"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }
turso = "0.7.2"
